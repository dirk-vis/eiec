name: Publish site

# Manual only, on purpose: nothing goes live until a person opens this repo's
# "Actions" tab, picks "Publish site", and clicks "Run workflow". That click
# is the review step -- check the spreadsheet looks right first, then publish.
on:
  workflow_dispatch: {}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install site dependencies
        run: npm install

      - name: Pull the spreadsheet + build the data file
        run: python3 transform.py

      - name: Build the site (Eleventy)
        run: npm run build

      - name: Build the search index (Pagefind)
        run: npx pagefind --site _site

      # One-time setup needed before this step works -- see the README's
      # "Setting up the automation" section:
      #   1. In the Cloudflare dashboard, create an API token using the
      #      premade "Edit Cloudflare Workers" template, and note your
      #      account ID.
      #   2. In this GitHub repo: Settings -> Secrets and variables -> Actions,
      #      add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID as secrets.
      # The Worker's name and static-assets config live in wrangler.jsonc,
      # not here -- wrangler deploy reads that file automatically.
      #
      # This deploys as a Cloudflare Worker (with static assets), which is
      # what Cloudflare currently recommends for new sites; their older
      # "Pages" product is de-emphasized in favor of this, and its own
      # deploy action (pages-action) is deprecated anyway.
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
